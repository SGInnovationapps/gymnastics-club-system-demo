<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>〇〇体操クラブ ｜ クラブ管理システム（デモ）</title>
<meta name="description" content="練習予定・出欠・月謝・お知らせ・進級・入会手続きをまとめた体操クラブ管理システムの画面モック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#171a1f; --ink70:#4b5158; --ink45:#848b93;
  --chalk:#edf0f5; --card:#fff; --line:#dbe1e9; --line-soft:#e9edf2;
  --mat:#1b4fa0; --mat-mid:#2c66c2; --mat-pale:#e5edfa;
  --gen:#4a76c4; --dev:#1f8a6b; --ath:#c2402b;
  --ok:#1f8a6b; --ok-pale:#e2f2ec;
  --bad:#c2402b; --bad-pale:#fbeae6;
  --warn:#a9762a; --warn-pale:#fbf1dd;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--chalk); color:var(--ink);
  font-family:"M PLUS 1",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.45}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--mat)}
.dela{font-weight:800}
.num{font-variant-numeric:tabular-nums}

/* ---------- demo bar ---------- */
.demobar{position:sticky;top:0;z-index:60;background:var(--ink);color:#e8ecf1;
  display:flex;align-items:center;gap:14px;padding:0 16px;height:46px}
.demobar .tag{font-size:11px;letter-spacing:.14em;border:1px solid #4a5058;border-radius:99px;padding:2px 9px;color:#aeb5bd;white-space:nowrap}
.demobar .hint{font-size:12px;color:#7d848c}
@media(max-width:820px){.demobar .hint{display:none}}
.roleset{display:flex;gap:4px;margin-left:auto;overflow:auto}
.roleset button{background:transparent;border:1px solid transparent;color:#99a1a9;border-radius:8px;padding:5px 11px;font-size:13px;white-space:nowrap}
.roleset button:hover{color:#fff}
.roleset button[aria-pressed=true]{background:#2c3138;color:#fff;border-color:#3e444c}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:242px 1fr;align-items:start}
.side{position:sticky;top:46px;height:calc(100vh - 46px);background:var(--card);
  border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
.brand .nm{font-weight:800;font-size:17px;letter-spacing:.01em;display:block;line-height:1.4}
.brand .sub{font-size:11px;color:var(--ink45);letter-spacing:.1em;margin-top:4px}
.navlabel{font-size:11px;color:var(--ink45);letter-spacing:.12em;padding:0 8px;margin:2px 0 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;
  padding:9px 10px;border-radius:10px;color:var(--ink70);font-size:14px}
.nav button:hover{background:var(--chalk);color:var(--ink)}
.nav button[aria-current=page]{background:var(--mat-pale);color:var(--mat);font-weight:700}
.nav .mk{width:6px;height:6px;border-radius:99px;background:transparent;flex:none}
.nav button[aria-current=page] .mk{background:var(--mat)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.whoami{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink45)}
.whoami b{display:block;color:var(--ink);font-size:13px}
.main{padding:30px 34px 90px;max-width:1140px}

/* ========== PC / スマホ の切り替え（body[data-ui] で分岐） ========== */
.mtop,.tabbar,.sheet{display:none}

body[data-ui=mobile] .side{display:none}
body[data-ui=mobile] .shell{grid-template-columns:1fr}
body[data-ui=mobile] .main{padding:16px 14px calc(78px + env(safe-area-inset-bottom))}

/* 上部アプリバー */
body[data-ui=mobile] .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:46px;z-index:40;
  background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
body[data-ui=mobile] .mtop .nm{font-weight:800;font-size:14px;line-height:1.3}
body[data-ui=mobile] .mtop .nm small{display:block;font-weight:400;font-size:11px;color:var(--ink45)}
body[data-ui=mobile] .mtop .who{margin-left:auto;font-size:11px;color:var(--ink45);text-align:right;line-height:1.4}
body[data-ui=mobile] .mtop .who b{display:block;color:var(--ink);font-size:12px;font-weight:700}

/* 下部タブバー */
body[data-ui=mobile] .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(18,20,24,.05)}
.tabbar button{flex:1;background:none;border:0;padding:5px 2px 3px;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink45);position:relative}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .tl{font-size:10.5px;letter-spacing:-.02em;line-height:1.2}
.tabbar button[aria-current=page]{color:var(--mat)}
.tabbar button[aria-current=page] .tl{font-weight:700}
.tabbar .dot{position:absolute;top:2px;right:calc(50% - 18px);min-width:15px;height:15px;line-height:15px;
  border-radius:99px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;text-align:center;padding:0 4px}

/* 「その他」のボトムシート */
.sheet{position:fixed;inset:0;z-index:70;align-items:flex-end}
.sheet.on{display:flex}
.sheet .bg{position:absolute;inset:0;background:rgba(18,20,24,.42)}
.sheet .panel{position:relative;width:100%;background:#fff;border-radius:18px 18px 0 0;
  padding:10px 14px calc(18px + env(safe-area-inset-bottom));max-height:76vh;overflow:auto}
.sheet .grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet .item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  padding:13px 8px;border-radius:12px;font-size:15px;color:var(--ink);text-align:left}
.sheet .item:active{background:var(--chalk)}
.sheet .item svg{width:21px;height:21px;stroke:var(--ink45);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet .item[aria-current=page]{color:var(--mat);font-weight:700}
.sheet .item[aria-current=page] svg{stroke:var(--mat)}
.sheet .item .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}

/* スマホ向けの寸法調整 */
body[data-ui=mobile] .phead{margin-bottom:16px}
body[data-ui=mobile] .phead h1{font-size:21px}
body[data-ui=mobile] .phead .lede{font-size:12.5px;margin-top:6px}
body[data-ui=mobile] .card{padding:15px 16px;border-radius:12px}
body[data-ui=mobile] .sechead{margin:20px 0 10px}
body[data-ui=mobile] .g2,body[data-ui=mobile] .g3,body[data-ui=mobile] .g4,
body[data-ui=mobile] .g-2-1,body[data-ui=mobile] .gcards{grid-template-columns:1fr}
body[data-ui=mobile] .gstat{grid-template-columns:repeat(2,1fr);gap:10px}
body[data-ui=mobile] .stat{padding:12px 13px}
body[data-ui=mobile] .stat .v{font-size:21px}
body[data-ui=mobile] .btn{padding:9px 15px}
body[data-ui=mobile] .tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
body[data-ui=mobile] .tabs button{flex:none}
body[data-ui=mobile] .next{padding:18px 18px;border-radius:12px}
body[data-ui=mobile] .next .when{font-size:20px}
body[data-ui=mobile] .ses{gap:12px}
body[data-ui=mobile] .ses .a{width:100%;order:3;padding-left:70px}
body[data-ui=mobile] .ses{flex-wrap:wrap}
body[data-ui=mobile] .stamps{gap:6px}
body[data-ui=mobile] .stamp .ring{max-width:52px;font-size:17px}
body[data-ui=mobile] .modal .box{border-radius:16px 16px 0 0;align-self:flex-end;max-height:92vh}
body[data-ui=mobile] .modal{padding:0;align-items:flex-end}

/* スマホ用リスト（テーブルの代わり） */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px}
.mrow .t{flex:1;min-width:0}
.mrow .t b{display:block;font-size:14px;font-weight:700;line-height:1.35}
.mrow .t small{display:block;font-size:11.5px;color:var(--ink45);line-height:1.4}
.mrow .r{flex:none;text-align:right}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:15px;color:var(--ink45);padding:0}
.seg button[aria-pressed=true][data-v=present]{background:var(--ok-pale);border-color:var(--ok);color:var(--ok);font-weight:700}
.seg button[aria-pressed=true][data-v=late]{background:var(--warn-pale);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button[aria-pressed=true][data-v=absent]{background:var(--bad-pale);border-color:var(--bad);color:var(--bad);font-weight:700}
.picker{display:flex;gap:6px;overflow-x:auto;padding:2px 14px 4px;margin:0 -14px}
.picker button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:8px 12px;font-size:12.5px;color:var(--ink70);line-height:1.35;text-align:center;white-space:nowrap}
.picker button b{display:block;font-size:15px;font-weight:800;color:var(--ink)}
.picker button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.picker button[aria-pressed=true] b{color:#fff}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- head ---------- */
.phead{margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--ink45);margin-bottom:7px}
.phead h1{font-weight:800;font-size:26px;letter-spacing:.01em;line-height:1.35}
.phead .lede{color:var(--ink70);font-size:13.5px;margin-top:8px;max-width:64ch}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:14px}
.card .cardnote{font-size:12px;color:var(--ink45);margin-top:2px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:1.55fr 1fr}
@media(max-width:920px){.g2,.g3,.g4,.g-2-1{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sechead h2{font-size:15px}
.sechead h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--mat);margin-right:9px;vertical-align:1px}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.stat .k{font-size:11.5px;color:var(--ink45);letter-spacing:.05em}
.stat .v{font-weight:800;font-size:24px;line-height:1.3;margin-top:5px}
.stat .v small{font-weight:500;font-size:12px;color:var(--ink45);margin-left:4px}
.stat.warn{border-color:#eccdc4;background:var(--bad-pale)}
.stat.warn .v{color:var(--bad)}

.btn{border:1px solid var(--mat);background:var(--mat);color:#fff;border-radius:10px;padding:8px 15px;font-size:13.5px;font-weight:500}
.btn:hover{background:var(--mat-mid);border-color:var(--mat-mid)}
.btn.ghost{background:transparent;color:var(--mat)}
.btn.ghost:hover{background:var(--mat-pale)}
.btn.quiet{background:transparent;color:var(--ink70);border-color:var(--line)}
.btn.quiet:hover{background:var(--chalk);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-pale);color:var(--ok)}
.pill.bad{background:var(--bad-pale);color:var(--bad)}
.pill.wait{background:var(--warn-pale);color:var(--warn)}
.pill.info{background:var(--mat-pale);color:var(--mat)}
.pill.mute{background:var(--chalk);color:var(--ink45)}

/* ---------- class chip: 構造の芯 ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 11px 2px 8px;
  font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.chip::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--c);flex:none}
.chip.lg{font-size:13px;padding:4px 14px 4px 11px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink70)}
.tabs button:hover{border-color:var(--ink45)}
.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.05em;color:var(--ink45);font-weight:500;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.namecell{white-space:nowrap;font-weight:500}
.namecell small{display:block;font-weight:400;color:var(--ink45);font-size:11.5px;line-height:1.35}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink45);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

label.f{display:block;font-size:12px;color:var(--ink70);margin-bottom:5px}
input[type=text],input[type=date],input[type=time],input[type=tel],input[type=email],select,textarea{
  width:100%;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--mat-mid);outline-offset:2px}
.field{margin-bottom:14px}
.help{font-size:11.5px;color:var(--ink45);margin-top:5px}

/* ---------- signature: 進級カード ---------- */
.lvcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lvcard .lvhead{display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--c) 9%,#fff);border-bottom:1px solid color-mix(in srgb,var(--c) 22%,#fff)}
.lvcard .lvbadge{font-weight:800;font-size:17px;color:var(--c);background:#fff;
  border:2px solid var(--c);border-radius:10px;padding:2px 10px;line-height:1.5;flex:none}
.lvcard .lvname{font-weight:700;font-size:14.5px;line-height:1.3}
.lvcard .lvname small{display:block;font-weight:400;font-size:11.5px;color:var(--ink45)}
.lvcard .lvbody{padding:14px 16px 16px}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stamp{background:none;border:0;padding:0;text-align:center}
.stamp .ring{width:100%;aspect-ratio:1;max-width:60px;margin:0 auto;border-radius:99px;
  border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;color:#c9d0d9;background:#fbfcfe;transition:.15s}
.stamp .lb{display:block;font-size:11px;color:var(--ink45);margin-top:6px;letter-spacing:-.02em}
.stamp[data-on=true] .ring{border-style:solid;border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 11%,#fff);transform:rotate(-6deg)}
.stamp[data-on=true] .lb{color:var(--ink);font-weight:700}
.stamp:hover .ring{border-color:var(--ink45)}
.stamp[disabled]{cursor:default}
.stamp[disabled]:hover .ring{border-color:var(--line)}
.stamp[disabled][data-on=true]:hover .ring{border-color:var(--c)}
.lvfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.lvfoot .cnt{font-size:12px;color:var(--ink45)}
.lvfoot .cnt b{font-weight:800;font-size:15px;color:var(--ink)}

/* 級の道のり */
.ladder{margin-top:4px}
.ladtrack{display:flex;gap:2px;height:14px}
.ladtrack i{flex:1;background:var(--c,#ddd);border-radius:3px}
.ladtrack i.future{background:var(--line-soft)}
.ladtrack i.now{box-shadow:0 0 0 2px var(--ink)}
.ladticks{display:flex;margin-top:5px}
.ladticks span{flex:1;text-align:center;font-size:9.5px;color:var(--ink45);letter-spacing:-.05em}
.ladticks span.now{color:var(--ink);font-weight:700}

/* ---------- 出席簿 ---------- */
.roll td.mark{text-align:center;padding:3px}
.roll th.day{text-align:center;font-size:11px;line-height:1.25;white-space:nowrap}
.roll th.day em{display:block;font-style:normal;font-size:10px;color:var(--ink45)}
.mk2{width:34px;height:30px;border-radius:8px;border:1px solid var(--line-soft);background:#fff;font-size:14px;line-height:1;color:var(--ink45)}
.mk2[data-v=present]{background:var(--ok-pale);border-color:#c3e0d4;color:var(--ok)}
.mk2[data-v=absent]{background:var(--bad-pale);border-color:#eecec5;color:var(--bad)}
.mk2[data-v=late]{background:var(--warn-pale);border-color:#e7d4a8;color:var(--warn)}
.mk2:hover{border-color:var(--ink45)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink45);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:16px;height:16px;border-radius:6px;display:inline-block;border:1px solid var(--line-soft)}

/* ---------- 月謝 ---------- */
.fee td.m{text-align:center;padding:4px}
.feecell{width:56px;height:30px;border-radius:8px;border:1px solid var(--line-soft);background:#fff;font-size:12px;color:var(--ink45)}
.feecell[data-v=paid]{background:var(--ok-pale);border-color:#c3e0d4;color:var(--ok);font-weight:700}
.feecell[data-v=unpaid]{background:var(--bad-pale);border-color:#eecec5;color:var(--bad)}
.feecell:hover{border-color:var(--ink45)}

/* ---------- schedule ---------- */
.seslist{display:flex;flex-direction:column}
.ses{display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.ses:last-child{border-bottom:0}
.ses .d{width:58px;flex:none;text-align:center;border-right:1px solid var(--line-soft);padding-right:12px}
.ses .d .dd{font-weight:800;font-size:21px;line-height:1.2}
.ses .d .mm,.ses .d .wd{font-size:10.5px;color:var(--ink45);letter-spacing:.05em}
.ses .d.sat .wd{color:var(--mat)}
.ses .d.sun .wd{color:var(--bad)}
.ses .b{flex:1;min-width:0}
.ses .b .ttl{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ses .b .meta{font-size:12.5px;color:var(--ink70);margin-top:2px}
.ses .a{flex:none;display:flex;align-items:center;gap:8px}
.ses.special{background:var(--warn-pale);margin:0 -20px;padding:14px 20px;border-radius:10px;border-bottom:0}

.next{background:var(--mat);color:#fff;border-radius:var(--r);padding:22px 24px}
.next .k{font-size:11px;letter-spacing:.16em;color:#a8c2e6}
.next .when{font-weight:800;font-size:23px;margin-top:8px;line-height:1.35}
.next .where{font-size:13.5px;color:#cbdcf2;margin-top:5px}
.next .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.next .acts button{border-radius:10px;padding:8px 15px;font-size:13.5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}

const fmtMon=mo=>(+mo.split('-')[1])+'月';
const yen=n=>'¥'+n.toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip=(c,lg)=>`<span class="chip ${lg?'lg':''}" style="--c:${c==='全体'?'#5a636d':CLS[c].c}">${c==='全体'?'全クラス':c}</span>`;
const unpaidList=()=>members.filter(m=>fees[m.id][THIS_MONTH]==='unpaid');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
function openModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}

function attendRate(mid){
  const m=mem(mid);
  const past=clsSessions(m.cls).filter(s=>s.past);
  if(!past.length) return {p:0,total:0,pct:0};
  const p=past.filter(s=>['present','late'].includes(attend[s.id][mid])).length;
  return {p,total:past.length,pct:Math.round(p/past.length*100)};
}
function stampCount(id){return EVENTS.filter(e=>stamps[id][e]).length;}
function readyToPromote(id){return stampCount(id)===EVENTS.length && mem(id).lv<LEVELS.length-1;}

/* 級の道のり */
function ladder(lv){
  const track=LEVELS.map((_,i)=>`<i class="${i>lv?'future':''}${i===lv?' now':''}" style="--c:${lvColor(i)}"></i>`).join('');
  const ticks=LEVELS.map((l,i)=>`<span class="${i===lv?'now':''}">${i===lv?l:(i===0?'入会':i===LEVELS.length-1?'初段':'')}</span>`).join('');
  return `<div class="ladder"><div class="ladtrack">${track}</div><div class="ladticks">${ticks}</div></div>`;
}

/* 進級カード（このモックの中心） */
function levelCard(m,{editable=false,showName=true}={}){
  const c=CLS[m.cls].c, n=stampCount(m.id), ready=readyToPromote(m.id);
  return `<div class="lvcard" style="--c:${c}">
    <div class="lvhead">
      <span class="lvbadge">${LEVELS[m.lv]}</span>
      ${showName?`<span class="lvname">${m.name}<small>${m.grade}・${m.cls}クラス</small></span>`:
        `<span class="lvname">進級カード<small>${EVENTS.length}種目そろうと次の級へ</small></span>`}
      ${ready?'<span class="pill ok" style="margin-left:auto">昇級できます</span>':''}
    </div>
    <div class="lvbody">
      <div class="stamps">${EVENTS.map(e=>{
        const on=stamps[m.id][e];
        return `<button class="stamp" data-on="${on}" ${editable?`onclick="toggleStamp(${m.id},'${e}')"`:'disabled'}
          aria-label="${m.name} ${e} ${on?'合格':'未合格'}">
          <span class="ring">${on?'合':'—'}</span><span class="lb">${e}</span></button>`;}).join('')}
      </div>
      <div class="lvfoot">
        <span class="cnt">合格 <b>${n}</b> / ${EVENTS.length} 種目</span>
        ${editable?`<button class="btn sm" onclick="promote(${m.id})" ${ready?'':'disabled'}>${LEVELS[m.lv+1]||'—'}に進級</button>`
          :`<span class="cnt">${m.lv>=LEVELS.length-1?'最高位です':'次は '+LEVELS[m.lv+1]}</span>`}
      </div>
    </div>
  </div>`;
}
function toggleStamp(id,e){stamps[id][e]=!stamps[id][e];render();}
function promote(id){
  const m=mem(id);
  if(!readyToPromote(id)){toast('4種目すべて合格すると進級できます');return;}
  const from=m.lv; m.lv++;
  EVENTS.forEach(e=>stamps[id][e]=false);
  promotions.unshift({id:'r'+Date.now(),date:'2026-08-30',mid:id,from,to:m.lv});
  render(); toast(`${m.name} さんを ${LEVELS[m.lv]} に進級登録しました`);
}

  document.getElementById('tabbar').innerHTML =
    bar.map(([v,,sh,ic])=>{const c=badgeCount(v);

  const fn=({

    'admin:news':adminNews,'admin:rank':adminRank,'admin:apply':adminApply,

    'member:news':memNews,'member:rank':memRank,'guest:join':guestJoin
  })[state.role+':'+state.view];

function badgeCount(v){
  if(state.role==='admin'&&v==='apply') return applications.filter(a=>a.status==='未確認').length;

function addSession(){
  const d=document.getElementById('ns-date').value;
  if(!d){toast('日付を入力してください');return;}
  const wd='日月火水木金土'[new Date(d+'T00:00').getDay()];
  const id='n'+Date.now().toString().slice(-6);
  sessions.push({id,cls:document.getElementById('ns-cls').value,date:d,wd,
    t:document.getElementById('ns-t1').value+'–'+document.getElementById('ns-t2').value,
    place:document.getElementById('ns-place').value,kind:document.getElementById('ns-kind').value||'通常練習',past:false});
  sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  attend[id]={}; closeModal(); render(); toast('練習日を保存しました');
}

function sendAbsent(sid){
  const r=document.getElementById('ab-r').value, n=document.getElementById('ab-n').value.trim();
  const reason = r==='そのほか（自由に書く）' ? (n||'欠席します') : r + (n?`（${n}）`:'');
  absences.unshift({id:'ab'+Date.now(),sid,mid:ME,reason,at:'8/19 '+new Date().toTimeString().slice(0,5)});
  closeModal(); render(); toast('欠席のご連絡を送りました');
}
function cancelAbsent(id){absences=absences.filter(a=>a.id!==id);render();toast('欠席の連絡を取り消しました');}

function memRoll(){
  const m=me(), past=clsSessions(m.cls).filter(s=>s.past).slice().reverse(), r=attendRate(ME);
  const LBL={present:['出席','ok'],late:['遅刻・早退','wait'],absent:['欠席','bad']};
  return head('出欠の記録','出席の記録','これまでの出欠です。指導員が記録した内容がそのまま表示されます。')
  + `<div class="grid g3 gstat">
      <div class="stat"><div class="k">出席率</div><div class="v">${r.pct}<small>%</small></div></div>
      <div class="stat"><div class="k">出席した回数</div><div class="v">${r.p}<small>/ ${r.total}回</small></div></div>
      <div class="stat"><div class="k">クラス</div><div class="v" style="font-size:18px">${m.cls}</div>
        <div style="margin-top:5px" class="cardnote">${CLS[m.cls].freq}</div></div>
    </div>
    <div class="sechead"><h2>一回ごとの記録</h2></div>
    ${isM()
      ? `<div class="mlist">${past.map(s=>{const v=attend[s.id][ME];
          return `<div class="mrow"><span class="t"><b>${fmtD(s.date)}（${s.wd}）${s.kind}</b><small>${s.place}</small></span>
          <span class="r">${v?`<span class="pill ${LBL[v][1]}">${LBL[v][0]}</span>`:'<span class="pill mute">未記入</span>'}</span></div>`;}).join('')}</div>`
      : `<div class="card"><div class="tablewrap"><table>
      <thead><tr><th>練習日</th><th>内容</th><th>会場</th><th style="text-align:right">記録</th></tr></thead>
      <tbody>${past.map(s=>{const v=attend[s.id][ME];
        return `<tr><td class="num" style="white-space:nowrap">${fmtD(s.date)}（${s.wd}）</td><td>${s.kind}</td>
        <td style="color:var(--ink45);font-size:12.5px">${s.place}</td>
        <td style="text-align:right">${v?`<span class="pill ${LBL[v][1]}">${LBL[v][0]}</span>`:'<span class="pill mute">未記入</span>'}</td></tr>`;}).join('')}
      </tbody></table></div></div>`}`;
}

function memFees(){
  const m=me(), paid=FEE_MONTHS.filter(mo=>fees[ME][mo]==='paid').length;
  return head('月謝','月謝の記録','納入の記録を確認できます。このページでのお支払いはできません。練習時に月謝袋でお持ちください。')
  + `<div class="grid g3 gstat">
      <div class="stat"><div class="k">月額（${m.cls}クラス）</div><div class="v">${yen(feeOf(m))}${m.sib?'<small>きょうだい割</small>':''}</div></div>
      <div class="stat"><div class="k">納入済み</div><div class="v">${paid}<small>/ ${FEE_MONTHS.length}か月</small></div></div>
      <div class="stat ${fees[ME][THIS_MONTH]==='unpaid'?'warn':''}"><div class="k">8月分</div>
        <div class="v" style="font-size:18px">${fees[ME][THIS_MONTH]==='paid'?'納入済み':'未納'}</div></div>
    </div>
    <div class="sechead"><h2>納入の記録</h2></div>
    ${isM()
      ? `<div class="mlist">${FEE_MONTHS.slice().reverse().map(mo=>`<div class="mrow">
          <span class="t"><b>2026年${fmtMon(mo)}分</b><small>${yen(feeOf(m))}</small></span>
          <span class="r">${fees[ME][mo]==='paid'?'<span class="pill ok">納入済み</span>':'<span class="pill bad">未納</span>'}</span></div>`).join('')}</div>`
      : `<div class="card"><div class="tablewrap"><table>
      <thead><tr><th>対象月</th><th>金額</th><th style="text-align:right">状態</th></tr></thead>
      <tbody>${FEE_MONTHS.slice().reverse().map(mo=>`<tr>
        <td class="num">2026年${fmtMon(mo)}分</td><td class="num">${yen(feeOf(m))}</td>
        <td style="text-align:right">${fees[ME][mo]==='paid'?'<span class="pill ok">納入済み</span>':'<span class="pill bad">未納</span>'}</td>
      </tr>`).join('')}</tbody></table></div></div>`}
    <p class="help" style="margin-top:12px">※ 記録に間違いがあると感じられた場合は、練習時に指導員へお声がけください。</p>`;
}

function memNews(){
  const mynews=newsFor(me());
  return head('クラブからのお知らせ','お知らせ',`全員宛のお知らせと、${me().cls}クラス宛のお知らせが表示されます。`)
  + `<div class="row" style="justify-content:flex-end;margin-bottom:10px">
      <button class="btn quiet sm" onclick="readAll()">すべて既読にする</button></div>
    <div class="stack">${mynews.map(n=>`
      <div class="card" style="${n.unread?'border-left:3px solid var(--bad)':''}">
        <div class="m" style="display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--ink45);flex-wrap:wrap">
          ${n.unread?'<span class="pill bad">未読</span>':''}${n.important?'<span class="pill wait">重要</span>':''}
          <span class="num">${n.date.replace(/-/g,'/')}</span>
          ${n.to!=='全員'?`<span class="pill info">${n.to}のみ</span>`:''}</div>
        <h3 style="margin-top:8px;font-size:16px">${esc(n.title)}</h3>
        <p style="margin-top:8px;font-size:13.5px;color:var(--ink70)">${esc(n.body)}</p>
      </div>`).join('')}</div>`;
}
function readAll(){newsFor(me()).forEach(n=>n.unread=false);render();toast('すべて既読にしました');}

function memRank(){
  const m=me(), hist=promotions.filter(p=>p.mid===ME), exam=sessions.find(s=>s.special);
  const n=stampCount(ME), rest=EVENTS.filter(e=>!stamps[ME][e]);
  return head('進級','進級カード',
    `合格した種目にスタンプがつきます。${EVENTS.length}種目そろうと、次のテストで ${LEVELS[m.lv+1]||'—'} に進級できます。`)
  + `<div class="grid g-2-1">
      ${levelCard(m,{editable:false,showName:false})}
      <div class="stack">
        <div class="card"><h3>いまの状況</h3>
          <div class="dela" style="font-size:28px;margin-top:6px">${n}<span style="font-weight:500;font-size:14px;color:var(--ink45)"> / ${EVENTS.length}種目</span></div>
          <p class="cardnote">${rest.length?'のこり：'+rest.join('・'):'すべて合格しています'}</p></div>
        <div class="card" style="border-color:#e7d4a8;background:var(--warn-pale)">
          <h3>次のテスト</h3>
          <p class="cardnote">${fmtD(exam.date)}（${exam.wd}）${exam.t}<br>${exam.place}　／　テスト料 1,000円</p></div>
      </div>
    </div>
    <div class="sechead"><h2>級の道のり</h2></div>
    <div class="card">${ladder(m.lv)}
      <p class="cardnote" style="margin-top:12px">${m.name}さんは <b>${LEVELS[m.lv]}</b>。${m.lv<LEVELS.length-1?`次は <b>${LEVELS[m.lv+1]}</b> です。`:'最高位です。'}</p></div>
    <div class="sechead"><h2>これまでの歩み</h2></div>
    ${hist.length?`<div class="card"><div class="tablewrap"><table>
      <thead><tr><th>テスト日</th><th>結果</th></tr></thead><tbody>
      ${hist.map(p=>`<tr><td class="num" style="white-space:nowrap">${p.date.replace(/-/g,'/')}</td>
        <td>${LEVELS[p.from]} <span style="color:var(--ink45)">→</span> <b>${LEVELS[p.to]}</b></td></tr>`).join('')}
      <tr><td class="num" style="white-space:nowrap">${m.joined.replace('-','年')}月</td><td>入会（${m.cls}クラス）</td></tr>
      </tbody></table></div></div>`
    :`<div class="empty"><b>まだ進級の記録はありません</b>はじめてのテストは入会からおよそ半年後が目安です。</div>`}`;
}

/* ---------------- 入会手続き ---------------- */
function guestJoin(){
  const st=state.joinStep;
  const steps=`<div class="steps">
    <div class="${st===1?'on':st>1?'done':''}">1　クラスと会員規約</div>
    <div class="${st===2?'on':st>2?'done':''}">2　入会申込</div>
    <div class="${st===3?'on':''}">3　受付完了</div></div>`;

  if(st===1) return `<div class="joinwrap">${head('入会のお手続き','受講クラスと会員規約',
    'ご希望のクラスをお選びのうえ、規約を最後までお読みください。育成・選手クラスは指導員との面談または選考があります。')}${steps}
    <div class="card" style="margin-bottom:14px">
      <h3 style="margin-bottom:12px">受講クラス</h3>
      <div class="clspick">${CLASS_LIST.map((c,i)=>`
        <label><input type="radio" name="wantcls" value="${c}" ${i===0?'checked':''}>
          <span><span class="t">${c}クラス ${chip(c)}</span>
          <span class="s">${CLS[c].freq}　${CLS[c].when}　／　月謝 ${yen(CLS[c].fee)}<br>${CLS[c].desc}</span></span></label>`).join('')}
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px">会員規約</h3>
      <div class="terms">
        <h5>第1条（目的）</h5>本規約は、〇〇体操クラブ（以下「当クラブ」）の練習に参加する会員および保護者と、当クラブとの関係について定めるものです。
        <h5>第2条（入会）</h5>入会を希望する方は所定の申込を行い、本規約に同意したうえで当クラブの承認を受けるものとします。未成年の方は保護者の同意が必要です。
        <h5>第3条（受講クラス）</h5>クラスは一般・育成・選手の3つとします。育成クラスおよび選手クラスへの在籍は、指導員の推薦または選考によるものとし、練習への参加状況や進級の状況をふまえて、クラスの変更をご相談する場合があります。
        <h5>第4条（月謝）</h5>月謝は一般クラス7,000円、育成クラス10,000円、選手クラス15,000円とし、当月分を当月第1週の練習時にお納めください。きょうだいで在籍される場合、2人目以降は1,000円を減額します。納入いただいた月謝は、月の途中で退会された場合も返金いたしません。
        <h5>第5条（練習および休講）</h5>練習はクラスごとに定めた曜日・時間に行います。会場の都合、天候、その他やむを得ない事情により、日程を変更または休講とする場合があります。変更はお知らせページでご連絡します。
        <h5>第6条（欠席の連絡）</h5>お休みされる場合は、事前にマイページの欠席連絡機能または指導員への連絡をお願いします。振替練習は行っておりません。
        <h5>第7条（進級テスト）</h5>進級テストは年2回程度実施します。受験には別途テスト料1,000円が必要です。合否は当クラブが定める基準により判定します。
        <h5>第8条（安全と保険）</h5>会員は年度ごとにスポーツ傷害保険へ加入していただきます。練習中の事故については、当クラブは保険の範囲内で対応するものとし、それを超える責任は負いかねます。
        <h5>第9条（健康状態）</h5>持病、アレルギー、服薬など、練習にあたって配慮が必要な事項は、申込時および変化があった際に必ずお知らせください。
        <h5>第10条（写真・動画の使用）</h5>練習や競技会で撮影した写真を、クラブだよりやお知らせに使用する場合があります。ご希望されない場合はお申し出ください。
        <h5>第11条（個人情報）</h5>お預かりした個人情報は、当クラブの運営および連絡のためにのみ使用し、第三者へ提供しません。
        <h5>第12条（退会）</h5>退会される場合は、前月末までに指導員へお申し出ください。
        <h5>第13条（規約の変更）</h5>本規約は必要に応じて変更することがあります。変更した場合はお知らせページでご連絡します。
      </div>
      <label class="agree"><input type="checkbox" id="agchk" ${state.agreed?'checked':''}
        onchange="state.agreed=this.checked;document.getElementById('agbtn').disabled=!this.checked">
        <span>会員規約のすべての条項を読み、内容に同意します。</span></label>
      <div style="display:flex;justify-content:flex-end;margin-top:18px">
        <button class="btn" id="agbtn" ${state.agreed?'':'disabled'} onclick="toStep2()">同意して申込に進む</button></div>
    </div></div>`;

  if(st===2){
    const w=state.applyDraft.want||'一般';
    return `<div class="joinwrap">${head('入会のお手続き','入会申込','お子さまと保護者の方の情報をご記入ください。＊は必ずご記入ください。')}${steps}
    <div class="card">
      <label class="agree" style="background:var(--ok-pale);margin-top:0;margin-bottom:18px"><input type="checkbox" checked disabled>
        <span>${w}クラスを希望　／　会員規約に同意済み（2026年8月19日）</span></label>
      <div class="row" style="gap:14px">
        <div class="field" style="flex:1;min-width:180px"><label class="f">お子さまのお名前＊</label><input type="text" id="j-child" placeholder="山田 太郎"></div>
        <div class="field" style="flex:1;min-width:180px"><label class="f">ふりがな＊</label><input type="text" id="j-kana" placeholder="やまだ たろう"></div></div>
      <div class="row" style="gap:14px">
        <div class="field" style="flex:1;min-width:150px"><label class="f">学年＊</label><select id="j-grade">
          <option>年中</option><option>年長</option><option selected>小1</option><option>小2</option><option>小3</option>
          <option>小4</option><option>小5</option><option>小6</option><option>中1</option><option>中2</option><option>中3</option></select></div>
        <div class="field" style="flex:1;min-width:150px"><label class="f">体操の経験</label><select id="j-exp">
          <option>はじめて</option><option>体操教室に通っていた</option><option>他クラブで進級経験あり</option></select></div></div>
      <div class="row" style="gap:14px">
        <div class="field" style="flex:1;min-width:180px"><label class="f">保護者のお名前＊</label><input type="text" id="j-guardian" placeholder="山田 花子"></div>
        <div class="field" style="flex:1;min-width:180px"><label class="f">電話番号＊</label><input type="tel" id="j-tel" placeholder="090-0000-0000"></div></div>
      <div class="field"><label class="f">メールアドレス＊</label><input type="email" id="j-email" placeholder="you@example.com">
        <p class="help">お知らせの通知先としても使用します。</p></div>
      <div class="field"><label class="f">配慮が必要なこと・ご質問（任意）</label>
        <textarea id="j-note" placeholder="アレルギー、持病、体験参加の有無など"></textarea></div>
      <div style="display:flex;justify-content:space-between;margin-top:18px">
        <button class="btn quiet" onclick="state.joinStep=1;render()">クラス選択に戻る</button>
        <button class="btn" onclick="submitJoin()">この内容で申し込む</button></div>
    </div></div>`;
  }

  const d=Object.assign({want:'一般',child:'',grade:'',guardian:'',email:'',at:''},state.applyDraft);
  return `<div class="joinwrap">${head('入会のお手続き','受付が完了しました','')}${steps}
    <div class="card" style="text-align:center;padding:34px 24px">
      <div class="done-seal">受</div>
      <h3 style="font-weight:800;font-size:18px">お申し込みをお預かりしました</h3>
      <p style="font-size:13.5px;color:var(--ink70);margin-top:10px;max-width:46ch;margin-inline:auto">
        指導員が内容を確認し、3日以内に ${esc(d.email||'ご登録のメールアドレス')} 宛に、体験練習の日程をご連絡します。
        ${d.want!=='一般'?`${d.want}クラスをご希望のため、体験の際に指導員との面談をあわせて行います。`:''}</p>
      <div style="text-align:left;max-width:340px;margin:22px auto 0;padding-top:18px;border-top:1px solid var(--line-soft)">
        <dl class="kv"><dt>お子さま</dt><dd>${esc(d.child||'')}（${esc(d.grade||'')}）</dd>
        <dt>希望クラス</dt><dd>${d.want?chip(d.want):''}</dd>
        <dt>保護者</dt><dd>${esc(d.guardian||'')} 様</dd>
        <dt>受付日時</dt><dd class="num">${esc(d.at||'')}</dd></dl></div>
      <div class="row" style="justify-content:center;margin-top:24px">
        <button class="btn ghost" onclick="go('admin','apply')">管理者側に届いた申込を見る</button></div>
    </div></div>`;
}
function toStep2(){
  const r=document.querySelector('input[name=wantcls]:checked');
  state.applyDraft.want = r?r.value:'一般';
  state.joinStep=2; render();
}
function submitJoin(){
  const v=id=>document.getElementById(id).value.trim();
  const need=[['j-child','お子さまのお名前'],['j-kana','ふりがな'],['j-guardian','保護者のお名前'],
              ['j-tel','電話番号'],['j-email','メールアドレス']];
  for(const [id,label] of need){ if(!v(id)){toast(label+'をご記入ください');document.getElementById(id).focus();return;} }
  const at='2026-08-19 '+new Date().toTimeString().slice(0,5);
  const want=state.applyDraft.want||'一般';
  state.applyDraft={want,child:v('j-child'),grade:v('j-grade'),guardian:v('j-guardian'),email:v('j-email'),at};
  applications.unshift({id:'p'+Date.now(),at,child:v('j-child'),kana:v('j-kana'),grade:v('j-grade'),want,
    guardian:v('j-guardian'),tel:v('j-tel'),email:v('j-email'),
    note:v('j-note')+(v('j-exp')!=='はじめて'?`（体操の経験：${v('j-exp')}）`:''),status:'未確認'});
  state.joinStep=3; render();
}

/* ---------------- 起動 ---------------- */
document.getElementById('roleset').addEventListener('click',e=>{
  const b=e.target.closest('button[data-role]'); if(!b)return;
  const r=b.dataset.role;
  if(r==='guest'){state.joinStep=1;state.agreed=false;state.applyDraft={};}
  go(r,NAVS[r][0][0]);
});
applyUI(); readHash(); render();
</script>
</body>
</html>
